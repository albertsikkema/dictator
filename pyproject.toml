[project]
name = "dictator"
version = "1.0.3"
description = "Push-to-talk speech-to-text using whisper.cpp"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT with Commons Clause"}
dependencies = [
    # main.py wraps pynput's private _create_event_tap; check it on upgrade
    "pynput>=1.7,<1.9; sys_platform == 'darwin'",
    "pyobjc-framework-applicationservices>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-avfoundation>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-servicemanagement>=10.0; sys_platform == 'darwin'",
    "sounddevice>=0.4; sys_platform == 'darwin'",
    "numpy>=1.24",
    "pywhispercpp>=1.4",
    "pillow>=12.1.0",
    "rumps>=0.4.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.0"]
test = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-mock>=3.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["main", "macos", "audio", "transcriber", "generate_icons"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "if __name__",
    "pragma: no cover",
]
